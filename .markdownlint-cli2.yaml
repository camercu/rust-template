# Markdown lint config (markdownlint-cli2). Structure rules (heading
# increments, single H1, fenced-code languages, no bare URLs) plus
# line length for prose.
config:
  # Prose wraps at 80 columns. Tables and fenced code cannot wrap at a
  # column without breaking, so they are exempt.
  MD013:
    tables: false
    code_blocks: false
  # Tables use `| cell |` spacing; pin the style so the "consistent"
  # default can't be poisoned by a single compact table elsewhere.
  MD060:
    style: "leading_and_trailing"
  # Repeated subsection names are valid under distinct parents; only
  # forbid duplicates among direct siblings.
  MD024:
    siblings_only: true
globs:
  - "**/*.md"
ignores:
  - node_modules
  - target
  - CHANGELOG.md
  # Local Claude Code config and installed skills — agent tooling, not
  # project docs, and often third-party Markdown that won't conform.
  - .claude

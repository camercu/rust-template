# Run the test suite under nextest so its slow-timeout (.config/nextest.toml)
# kills a hung test, which fails it: an infinite-loop mutant then counts as
# caught, and the rest of the suite still runs.
test_tool = "nextest"

# cargo-mutants' timeout bounds the whole test run, not one test, so no
# per-test kill can promise to fire first: a mutant that hangs more tests than
# nextest runs at once can still time out. That is fine: a timed-out mutant's
# tests did not pass, and the justfile's mutants recipes count it as caught.
# This floor, above nextest's 2x10s kill, only keeps a fast baseline from
# auto-setting a timeout too short for a loaded machine.
minimum_test_timeout = 30

# If the crate grows feature-gated code, compile it into mutants runs here —
# mutants in cfg'd-out code trivially survive:
# additional_cargo_args = ["--features", "some-feature"]

# Excluding a mutant no test can kill — record the reason beside each entry:
#
# - An equivalent mutant (e.g. `|` -> `^` over disjoint bitflags, which
#   yields the same value): exclude by description, anchored on the function
#   name with `$` so it cannot also hide the same mutation elsewhere:
#       exclude_re = ['replace \| with \^ in open_flags$']
# - Code compiled out on the host (a per-OS fallback): mark the item
#   `#[cfg_attr(test, mutants::skip)]` so the exclusion moves with the code.
#   Never exclude by file line number: it goes stale the moment the file above
#   it grows, and then silently excludes whatever moved into that line.

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  canonical-gate:
    name: Canonical gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Parse .tool-versions
        id: tools
        run: |
          while read -r name version; do
            # GitHub output names use underscores; tool names use hyphens.
            echo "${name//-/_}=${version}" >> "$GITHUB_OUTPUT"
          done < <(grep -v '^#' .tool-versions | grep -v '^$')

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.tools.outputs.rust }}
          components: clippy,rustfmt,llvm-tools

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just@${{ steps.tools.outputs.just }},cargo-deny@${{ steps.tools.outputs.cargo_deny }},cargo-nextest@${{ steps.tools.outputs.cargo_nextest }},typos-cli@${{ steps.tools.outputs.typos_cli }},taplo-cli@${{ steps.tools.outputs.taplo_cli }},cargo-llvm-cov@${{ steps.tools.outputs.cargo_llvm_cov }}

      # `just lint` shells out to markdownlint-cli2, an npm tool the
      # cargo-centric install-action above can't provide. Locally it
      # comes from nix-shell; here npm -g, pinned via .tool-versions.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions

      - name: Install markdownlint-cli2
        env:
          # Pass the version through the environment, not `${{ }}` inlined
          # into the shell: .tool-versions is editable in a forked PR, so a
          # crafted version string would otherwise inject into the command.
          MDL_VERSION: ${{ steps.tools.outputs.markdownlint_cli2 }}
        run: npm install -g "markdownlint-cli2@${MDL_VERSION}"

      # actionlint is a Go binary, not a cargo crate, so install-action
      # can't provide it. Pull the pinned release tarball straight from
      # GitHub (version from .tool-versions) onto PATH.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: ${{ steps.tools.outputs.actionlint }}
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Install the crate's declared MSRV toolchain (Cargo.toml
      # `rust-version`) when it differs from the pinned toolchain, so the
      # `check-msrv` step in `just ci` can build against it. No-op while the
      # MSRV equals the pinned toolchain.
      - name: Install MSRV toolchain
        env:
          PINNED_RUST: ${{ steps.tools.outputs.rust }}
        run: |
          msrv=$(cargo metadata --format-version 1 --no-deps \
            | grep -o '"rust_version":"[^"]*"' | head -1 | cut -d'"' -f4)
          if [ -n "${msrv}" ] && [ "${msrv}" != "${PINNED_RUST}" ]; then
            rustup toolchain install "${msrv}" --profile minimal
          fi

      - name: just ci
        run: just ci

  stable-advisory:
    # Latest-stable rustc / clippy run against the workspace. Failures
    # block merges so toolchain drift surfaces immediately — there is
    # no silent "this is OK because it's just an advisory" path. When
    # stable rustc tightens diagnostics or lints, the bump becomes a
    # forcing function for updating `.tool-versions` + snapshots.
    name: Latest stable advisory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest

      - name: just ci-stable
        run: just ci-stable

  mutants-diff:
    # Mutation-tests only the code changed by this push/PR: fast gate
    # that changed code arrives with tests that kill its mutants. Full
    # sweeps stay manual (`just mutants`).
    name: Mutants (diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Parse .tool-versions
        id: tools
        run: |
          while read -r name version; do
            # GitHub output names use underscores; tool names use hyphens.
            echo "${name//-/_}=${version}" >> "$GITHUB_OUTPUT"
          done < <(grep -v '^#' .tool-versions | grep -v '^$')

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.tools.outputs.rust }}

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just@${{ steps.tools.outputs.just }},cargo-nextest@${{ steps.tools.outputs.cargo_nextest }},cargo-mutants@${{ steps.tools.outputs.cargo_mutants }}

      - name: just mutants-diff
        env:
          # `github.event.before` is all-zeroes on the first push to a
          # new branch, and is orphaned (unreachable in the fetched
          # history) after a force-push. In either case fall back to
          # the parent commit.
          PR_BASE: origin/${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            base=HEAD~1
          else
            base="$PUSH_BEFORE"
          fi
          just mutants-diff "$base"

  commitlint:
    # Runs on both pull_request and push so direct-to-main commits
    # are linted too. Branch protection may permit direct pushes;
    # this job ensures Conventional Commits regardless of merge path.
    name: Commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Lint commits against Conventional Commits
        env:
          # `github.event.before` is all-zeroes on the first push to a
          # new branch, and is orphaned (unreachable in the fetched
          # history) after a force-push. In either case fall back to
          # linting just the single most-recent commit via `--last`.
          PR_BASE: origin/${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx --no-install commitlint --from "$PR_BASE" --to HEAD --verbose
          elif [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            npx --no-install commitlint --last --verbose
          else
            npx --no-install commitlint --from "$PUSH_BEFORE" --to "$PUSH_AFTER" --verbose
          fi
